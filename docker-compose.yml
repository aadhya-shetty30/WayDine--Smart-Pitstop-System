services:
  db:
    image: postgis/postgis:16-3.4
    container_name: waydine-db
    environment:
      POSTGRES_USER: waydine
      POSTGRES_PASSWORD: waydine
      POSTGRES_DB: waydine
    ports:
      - "5432:5432"
    volumes:
      - waydine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waydine"]
      interval: 5s
      retries: 10

volumes:
  waydine_pgdata:
