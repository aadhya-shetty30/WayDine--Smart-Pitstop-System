# Render.com blueprint: New + -> Blueprint -> pick this repo.
# The build seeds the SQLite database from the OSM data committed in data/
# (no downloads needed); the server then loads the road graph once at startup.
services:
  - type: web
    name: waydine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m db.seed
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /presets
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # no PostgreSQL on the free plan: use the SQLite fallback straight away
      - key: WAYDINE_FORCE_SQLITE
        value: "1"
